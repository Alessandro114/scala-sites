name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `npm run lint` is deliberately not run here: the demo app has no
      # ESLint config, so `next lint` drops into an interactive setup prompt
      # and fails. Configure ESLint, then add the step back.
